name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back-end (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, gd, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Padrão de código (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Testes (Pest)
        run: vendor/bin/pest

  frontend:
    name: Front-end (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run type-check

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, gd, pdo_sqlite, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências da API
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Instalar dependências do front
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A API sobe com SQLite, fila síncrona e e-mails no log (ver playwright.config.ts).
      - name: Testes ponta a ponta
        working-directory: frontend
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
