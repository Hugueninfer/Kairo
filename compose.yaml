# Serviços de apoio para desenvolvimento local.
# A API (php artisan serve) e o front (npm run dev) rodam na sua máquina e se conectam a eles.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kairo
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interface web para ver os e-mails

volumes:
  postgres-data:
  redis-data:
